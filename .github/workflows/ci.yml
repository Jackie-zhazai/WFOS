# Minimal on purpose: install, lint, test. No matrix, because there is nothing to
# vary — the project is developed and verified on Windows, and a job that ran on
# Linux would be asserting support nobody has checked. If that changes, add the
# runner in the same commit as the evidence.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite drives the CLI as a subprocess and writes UTF-8 to pipes; the
        # console default on Windows is not UTF-8, and the failures that produces
        # look like broken assertions rather than an encoding mismatch.
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q
